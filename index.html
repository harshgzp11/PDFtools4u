    <!-- Deferred Analytics -->
    <script>
      const loadAnalytics = () => {
        if (window.analyticsLoaded) return;
        window.analyticsLoaded = true;
        
        window.dataLayer = window.dataLayer || [];
        window.gtag = window.gtag || function(){window.dataLayer.push(arguments);};
        window.gtag('js', new Date());
        window.gtag('config', 'G-4ZKBY66LCN');

        const gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-4ZKBY66LCN";
        document.head.appendChild(gtagScript);

        // Microsoft Clarity Analytics
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y12xfabti3");
      };
      
      // Schedule analytics on first user interaction, yielding the main thread
      // so the user's initial tap/click visual response paints with 0ms INP delay.
      const triggerAnalytics = () => {
        if (window.analyticsLoaded) return;
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadAnalytics, { timeout: 2000 });
        } else {
          setTimeout(loadAnalytics, 1);
        }
      };

      ['touchstart', 'pointerdown', 'scroll', 'click', 'keydown', 'drop'].forEach(e =>
        window.addEventListener(e, triggerAnalytics, { once: true, passive: true, capture: true })
      );
    </script>
