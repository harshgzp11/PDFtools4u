    <script>
      window.addEventListener('error', function(event) {
        try {
          var errStr = (event.error && event.error.stack) ? event.error.stack : (event.message || String(event));
          document.body.innerHTML = '<div style="color: red; padding: 20px; font-size: 20px; white-space: pre-wrap;">' + errStr + '</div>';
        } catch (e) {
          console.error("Error in error handler", e);
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        try {
          var reasonStr = (event.reason && event.reason.stack) ? event.reason.stack : String(event.reason);
          document.body.innerHTML = '<div style="color: red; padding: 20px; font-size: 20px; white-space: pre-wrap;">' + reasonStr + '</div>';
        } catch (e) {
          console.error("Error in rejection handler", e);
        }
      });
    </script>

    <!-- Deferred Analytics -->
    <script>
      const loadAnalytics = () => {
        if (window.analyticsLoaded) return;
        window.analyticsLoaded = true;
        
        // Google Tag Manager
        const gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = "https://www.googletagmanager.com/gtag/js?id=G-4ZKBY66LCN";
        document.head.appendChild(gtagScript);
        
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-4ZKBY66LCN');

        // Microsoft Clarity Analytics
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "y12xfabti3");
      };
      
      // Load analytics on first user interaction or when idle
      ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'].forEach(e => 
        window.addEventListener(e, loadAnalytics, { once: true, passive: true })
      );
      
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadAnalytics, { timeout: 5000 });
      } else {
        setTimeout(loadAnalytics, 5000);
      }
    </script>
